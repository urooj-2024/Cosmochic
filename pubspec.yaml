name: cosmochic
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core:
  camera: ^0.10.0  # Latest version of the camera package
  google_ml_kit: ^0.7.0  # Latest version for ML Kit integration

dev_dependencies:
